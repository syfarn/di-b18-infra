# GitHub Actions workflow ka naam
name: Terraform CI/CD

# Workflow ko trigger karne wale events
on:

  # Code push hone par workflow chalega
  push:

    # In branches ke push events par workflow trigger hoga
    branches:
      - main
      - "feature/**"

  # Main branch ke against PR create/update hone par
  pull_request:
    branches:
      - main

# GitHub token ko repository content read karne ki permission
permissions:
  contents: read

# Sabhi jobs ke liye common environment variables
env:

  # Terraform code ki working directory
  TF_WORKING_DIR: environments/preprod

  # Azure authentication values GitHub Secrets se aayengi
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

# Workflow ke andar execute hone wale jobs
jobs:

  # ============================================================
  # JOB 1: Terraform Init, Format Check aur Validation
  # ============================================================
  terraform-init-validate:

    # GitHub Actions UI me job ka display name
    name: Terraform Init, Format and Validate

    # Job Ubuntu runner par chalega
    runs-on: ubuntu-latest

    # Is job ki run commands Terraform directory me chalengi
    defaults:
      run:
        working-directory: environments/preprod

    # Job ke andar sequentially execute hone wale steps
    steps:

      # Repository code ko runner par download karega
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Required Terraform version install karega
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      # Check karega ki required Azure secrets present hain
      # Koi secret missing hua to job fail ho jayega
      - name: Check Azure Secrets
        shell: bash
        run: |
          test -n "$ARM_CLIENT_ID" || { echo "ARM_CLIENT_ID MISSING"; exit 1; }
          test -n "$ARM_CLIENT_SECRET" || { echo "ARM_CLIENT_SECRET MISSING"; exit 1; }
          test -n "$ARM_TENANT_ID" || { echo "ARM_TENANT_ID MISSING"; exit 1; }
          test -n "$ARM_SUBSCRIPTION_ID" || { echo "ARM_SUBSCRIPTION_ID MISSING"; exit 1; }
          echo "All Azure secrets are present"

      # Terraform backend, providers aur modules initialize karega
      - name: Terraform Init
        run: terraform init -input=false

      # Terraform files ki formatting check karega
      # Incorrect formatting milne par job fail ho jayega
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Terraform configuration aur syntax validate karega
      - name: Terraform Validate
        run: terraform validate

  # ============================================================
  # JOB 2: TFLint aur Checkov Security Scanning
  # ============================================================
  security-scanning:

    # GitHub Actions UI me job ka display name
    name: TFLint and Checkov Scan

    # Job 1 successful hone ke baad hi ye job chalega
    needs: terraform-init-validate

    # Job Ubuntu runner par chalega
    runs-on: ubuntu-latest

    # Is job ki run commands Terraform directory me chalengi
    defaults:
      run:
        working-directory: environments/preprod

    # Security scanning job ke steps
    steps:

      # Repository code ko naye runner par download karega
      - name: Checkout Repository
        uses: actions/checkout@v4

      # TFLint tool install karega
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      # TFLint plugins aur configuration initialize karega
      - name: Initialize TFLint
        run: tflint --init

      # Terraform code quality aur best practices scan karega
      - name: Run TFLint
        run: tflint --recursive

      # Checkov Terraform security misconfigurations scan karega
      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:

          # Terraform configuration ki location
          directory: environments/preprod

          # Sirf Terraform files ko scan karega
          framework: terraform

          # Security issue milne par pipeline fail hogi
          soft_fail: false

          # Scan output ko concise rakhega
          quiet: true

  # ============================================================
  # JOB 3: Terraform Plan Generate aur Upload
  # ============================================================
  terraform-plan:

    # GitHub Actions UI me job ka display name
    name: Terraform Plan

    # Security scans successful hone ke baad hi chalega
    needs: security-scanning

    # Job Ubuntu runner par chalega
    runs-on: ubuntu-latest

    # Is job ki run commands Terraform directory me chalengi
    defaults:
      run:
        working-directory: environments/preprod

    # Terraform plan job ke steps
    steps:

      # Repository code ko naye runner par download karega
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Required Terraform version install karega
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      # Naye runner par Terraform dobara initialize karega
      - name: Terraform Init
        run: terraform init -input=false

      # Terraform execution plan generate karega
      # Plan ko tfplan binary file me save karega
      - name: Generate Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan

      # Saved tfplan ko GitHub artifact ke roop me upload karega
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:

          # Workflow run ID artifact name ko unique banayegi
          name: terraform-plan-${{ github.run_id }}

          # Upload ki jane wali plan file
          path: environments/preprod/tfplan

          # Plan file missing hui to step fail ho jayega
          if-no-files-found: error

          # Plan artifact sirf ek din tak store hoga
          retention-days: 1

  # ============================================================
  # JOB 4: Infracost Cost Scan
  # ============================================================
  infracost-scan:

    # GitHub Actions UI me job ka display name
    name: Infracost Scan

    # Terraform plan generate hone ke baad hi chalega
    needs: terraform-plan

    # Job Ubuntu runner par chalega
    runs-on: ubuntu-latest

    # Is job ki run commands Terraform directory me chalengi
    defaults:
      run:
        working-directory: environments/preprod

    # Infracost job ke steps
    steps:

      # Repository code ko naye runner par download karega
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Terraform CLI install karega
      # terraform show command ke liye required hai
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      # Terraform provider aur module information initialize karega
      - name: Terraform Init
        run: terraform init -input=false

      # Plan job me upload hua tfplan artifact download karega
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:

          # Terraform plan job ka artifact name
          name: terraform-plan-${{ github.run_id }}

          # Artifact is directory me download hoga
          path: environments/preprod

      # Infracost CLI install aur authenticate karega
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:

          # Infracost API key GitHub Secret se aayegi
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # Binary tfplan ko readable JSON format me convert karega
      # JSON file sirf temporary runner par rahegi
      - name: Convert Terraform Plan to JSON
        run: terraform show -json tfplan > tfplan.json

      # Terraform resources ki estimated monthly cost calculate karega
      # Result GitHub Actions pipeline logs me dikhega
      - name: Run Infracost Breakdown
        run: |
          infracost breakdown \
            --path tfplan.json \
            --format table

  # ============================================================
  # JOB 5: Manual Approval aur Terraform Apply
  # ============================================================
  terraform-apply:

    # GitHub Actions UI me job ka display name
    name: Approve and Apply Terraform Plan

    # Infracost scan successful hone ke baad hi chalega
    needs: infracost-scan

    # Job Ubuntu runner par chalega
    runs-on: ubuntu-latest

    # Apply sirf main branch ke push/merge event par chalega
    # Pull request aur feature branch par apply nahi hoga
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # GitHub Environment ke required reviewers approval denge
    environment: preprod

    # Ek time par sirf ek preprod apply job chalne dega
    concurrency:

      # Preprod environment ke liye concurrency group
      group: terraform-preprod

      # Running apply job ko cancel nahi karega
      cancel-in-progress: false

    # Is job ki run commands Terraform directory me chalengi
    defaults:
      run:
        working-directory: environments/preprod

    # Apply job ke steps
    steps:

      # Repository code ko apply runner par download karega
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Plan job wali same Terraform version install karega
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      # Backend, providers aur modules initialize karega
      - name: Terraform Init
        run: terraform init -input=false

      # Plan job me generate hua exact tfplan download karega
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:

          # Upload ke time use hua same artifact name
          name: terraform-plan-${{ github.run_id }}

          # Plan ko Terraform working directory me rakhega
          path: environments/preprod

      # Download hue exact saved plan ko Azure par apply karega
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan